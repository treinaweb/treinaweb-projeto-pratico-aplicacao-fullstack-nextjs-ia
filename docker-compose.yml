services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twjobs
      POSTGRES_PASSWORD: twjobs
      POSTGRES_DB: twjobs_ai
    ports:
      - "5432:5432"
    volumes:
      - twjobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twjobs -d twjobs_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  twjobs_postgres_data:
